spring.application.name=notification-system-v2

spring.datasource.url=jdbc:postgresql://localhost:5432/notification_system
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mailpit Integration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# Rate Limiting
rate-limit.capacity=5
rate-limit.refill-tokens=5
rate-limit.refill-duration=1m


# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=notification_user
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.dynamic=true


# RabbitMQ Messaging Topology
notification.rabbitmq.exchange=notification.exchange
notification.rabbitmq.queue=notification.delivery.queue
notification.rabbitmq.routing-key=notification.delivery


notification.outbox.batch-size=10
notification.outbox.lock-duration-seconds=60
notification.outbox.publisher-interval-ms=5000


spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true



# Retry topology
notification.rabbitmq.retry-exchange=notification.retry.exchange

notification.rabbitmq.retry-5s-queue=notification.retry.5s.queue
notification.rabbitmq.retry-10s-queue=notification.retry.10s.queue

notification.rabbitmq.retry-5s-routing-key=notification.retry.5s
notification.rabbitmq.retry-10s-routing-key=notification.retry.10s


# Dead Letter topology
notification.rabbitmq.dlq-exchange=notification.dlq.exchange
notification.rabbitmq.dlq-queue=notification.dlq
notification.rabbitmq.dlq-routing-key=notification.dlq



