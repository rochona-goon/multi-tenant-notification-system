spring.application.name=delivery-worker

server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_system
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=notification_user
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Mailpit SMTP
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# RabbitMQ listener
notification.rabbitmq.queue=notification.delivery.queue
notification.rabbitmq.listener.enabled=true

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.prefetch=1


# Retry and DLQ routing
notification.rabbitmq.retry-exchange=notification.retry.exchange
notification.rabbitmq.retry-5s-routing-key=notification.retry.5s
notification.rabbitmq.retry-10s-routing-key=notification.retry.10s

notification.rabbitmq.dlq-exchange=notification.dlq.exchange
notification.rabbitmq.dlq-routing-key=notification.dlq


# RabbitMQ publisher reliability
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true


# Notification delivery config
notification.delivery.attempt-lease=PT2M
notification.delivery.max-attempts=3


# SMTP connection and operation timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000


# Graceful application shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# RabbitMQ listener graceful shutdown
spring.rabbitmq.listener.simple.shutdown-timeout=45s
